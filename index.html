<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Mes applis</title>
  <meta name="theme-color" content="#1b1f24">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5c6670;
      --border: #d5dae0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --surface: #191d23;
        --text: #e8eaed;
        --muted: #9aa3ad;
        --border: #2d333b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: max(24px, env(safe-area-inset-top)) 16px 24px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .tile:active { transform: scale(0.97); }
    .tile img { width: 64px; height: 64px; border-radius: 16px; }
    .tile strong { font-size: 1rem; }
    .tile span { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Mes applis</h1>

  <!-- Pour ajouter une appli : créer son dossier et copier une tuile ci-dessous. -->
  <div class="grid">
    <a class="tile" href="dictee/">
      <img src="dictee/icon-192.png" alt="">
      <strong>Dictée</strong>
      <span>Parler pour écrire</span>
    </a>
  </div>
</body>
</html>
