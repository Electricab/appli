          if (style.length) child.setAttribute('style', style.map(([p, v]) => `${p}: ${v}`).join('; '));
          if (color && /^#?\w+$/.test(color)) child.setAttribute('color', color);
        }
      };
      clean(doc.body);
      return doc.body.innerHTML;
    }

    const textDoc = { id: null, dirty: false };
    const tBody = $('#t-body');
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('defaultParagraphSeparator', false, 'p');

    function openText(t, rec) {
      textDoc.id = t.id; textDoc.dirty = false;
      $('#t-title').textContent = t.title;
      $('#t-state').textContent = '';
      tBody.innerHTML = sanitizeHtml(rec?.body || '');
      loadHtmlPhotos(tBody);
      showScreen('text');
      if (!tBody.textContent.trim()) tBody.focus();
    }

    const hasText = () => !!tBody.textContent.trim() || !!tBody.querySelector('img');
    const saveText = debounceAsync(async () => {
      if (!textDoc.id || !textDoc.dirty) return;
      textDoc.dirty = false;
      const id = textDoc.id, t = find(id);
      if (!t || (!t.format && !hasText())) return; // rien écrit : pas de contenu créé
      const now = nowIso(), body = sanitizeHtml(tBody.innerHTML);
      await idb.put({ id, body, body_at: now, pushed: false });
      bodyCache.set(id, { body, body_at: now });
      change(t, { format: 'html', body_at: now }, 8000);
      $('#t-state').textContent = `✓ Enregistré à ${fmtHour(now)}`;
    }, 800);
    function textChanged() {
      textDoc.dirty = true;
      $('#t-state').textContent = '…';
      saveText();
    }
    async function leaveText() {
      if (!textDoc.id) return;
      await saveText.flush();
      textDoc.id = null;
      syncSoon(500);
    }
    tBody.addEventListener('input', textChanged);
    tBody.addEventListener('paste', e => {
      const html = e.clipboardData.getData('text/html');
      if (!html) return;
      e.preventDefault();
      document.execCommand('insertHTML', false, sanitizeHtml(html));
    });
    // Les boutons ne prennent pas le focus : la sélection dans le texte est gardée
    $('#t-tools').addEventListener('pointerdown', e => { if (e.target.closest('button')) e.preventDefault(); });
    $('#t-tools').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || b.id === 't-photo') return;
      tBody.focus();
      if (b.dataset.cmd) document.execCommand(b.dataset.cmd, false, null);
      else document.execCommand(b.dataset.color, false, b.dataset.value);
      textChanged();
    });
    $('#t-back').addEventListener('click', () => history.back());

    // Photo dans le texte : insérée à l'endroit du curseur
    let textRange = null;
    $('#t-photo').addEventListener('click', () => {
      const sel = getSelection();
      textRange = sel.rangeCount && tBody.contains(sel.anchorNode) ? sel.getRangeAt(0).cloneRange() : null;
      photoTarget = 'text';
      if (ON_PC) $('#photo-pick').click(); else photoMenu(true);
    });
    async function addTextPhoto(file) {
      try {
        const { id, base64 } = await storePhoto(file);
        tBody.focus();
        if (textRange) { getSelection().removeAllRanges(); getSelection().addRange(textRange); }
        document.execCommand('insertHTML', false, `<img data-photo="${id}" src="data:image/jpeg;base64,${base64}"><p><br></p>`);
        textChanged();
      } catch (e) {
        toast(e.message);
      }
    }

    // ---------- Réglages (téléphone) ----------
    function openSetup() {
      $('#s-repo').value = config.repo || 'Electricab/stock-donnees';
      $('#s-token').value = '';
      $('#s-token').required = !config.token;
      $('#s-token-state').textContent = config.token ? '(enregistrée — laisser vide pour la garder)' : '';
      $('#setup-msg').textContent = '';
      $('#setup').showModal();
    }
    $('#btn-settings').addEventListener('click', openSetup);
    $('#s-cancel').addEventListener('click', () => $('#setup').close());
    $('#setup-form').addEventListener('submit', async e => {
      e.preventDefault();
      const repo = $('#s-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$|\/$/g, '');
      const token = $('#s-token').value.trim() || config.token;
      const previous = config;
      config = { repo, token };
      $('#setup-msg').textContent = 'Connexion à GitHub…';
      $('#s-save').disabled = true;
      try {
        const res = await fetch(`https://api.github.com/repos/${repo}`, {
          cache: 'no-store', headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
        });
        if (res.status === 401) throw new Error('Clé refusée par GitHub (invalide ou expirée)');
        if (!res.ok) throw new Error('Dépôt introuvable, ou clé sans accès à ce dépôt');
        const info = await res.json();
        if (info.permissions && !info.permissions.push) throw new Error('La clé n\'a pas le droit d\'écrire (« Contents : Read and write »)');
        save('todo-config', config);
        $('#setup').close();
        toast('To do list reliée');
        sync({ quiet: true });
      } catch (err) {
        config = previous;
        $('#setup-msg').textContent = err.message;
      } finally {
        $('#s-save').disabled = false;
      }
    });

    // ---------- Démarrage ----------
    // Ancienne description en texte simple : devient un contenu « au clavier »
    async function migrateDescriptions() {
      for (const t of items) {
        if (t.deleted || !t.description || t.format) continue;
        const now = nowIso(), body = `<p>${esc(t.description).replace(/\n/g, '<br>')}</p>`;
        await idb.put({ id: t.id, body, body_at: now, pushed: false });
        Object.assign(t, { format: 'html', body_at: now, description: '', updated_at: now });
        dirty = true; rev++;
      }
      persist();
    }

    if (ON_PC) {
      $('#back').href = '/';
      $('#back').textContent = '← Plateforme';
      new EventSource('/api/presence'); // garde la plateforme lancée tant que la page est ouverte
    } else {
      $('#back').textContent = '← Mes applis';
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Une autre fenêtre de la To do list sur le même appareil a modifié la liste
    window.addEventListener('storage', e => {
      if (e.key === 'todo-items') { items = load('todo-items', []); if (screen === 'list') render(); }
    });
    window.addEventListener('online', () => sync({ quiet: true }));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        // Application quittée ou mise en arrière-plan : on enregistre et on envoie
        Promise.all([saveInk.flush(), saveText.flush()]).then(() => sync({ quiet: true }));
      } else if (screen === 'list') sync({ quiet: true });
    });
    setInterval(() => { if (!document.hidden && screen === 'list') sync({ quiet: true }); }, 60 * 1000);

    history.replaceState({ screen: 'list' }, '');
    migrateDescriptions().finally(() => {
      render();
      if (!ready()) openSetup(); else sync({ quiet: true });
    });
  </script>
</body>
</html>
