<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dictée</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5c6670;
      --border: #d5dae0;
      --accent: #1f6feb;
      --rec: #d93025;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --surface: #191d23;
        --text: #e8eaed;
        --muted: #9aa3ad;
        --border: #2d333b;
        --accent: #4c8dff;
        --rec: #ff5a4f;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      gap: 16px;
    }
    header { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 1.25rem; margin: 0; }
    #status { font-size: 0.9rem; color: var(--muted); }

    .zone {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    textarea {
      flex: 1;
      width: 100%;
      border: 0;
      resize: none;
      padding: 16px;
      font: inherit;
      font-size: 1.15rem;
      line-height: 1.5;
      background: transparent;
      color: var(--text);
      outline: none;
    }
    #interim {
      min-height: 1.5em;
      padding: 0 16px 12px;
      color: var(--muted);
      font-style: italic;
      font-size: 1.05rem;
    }

    .actions { display: flex; gap: 12px; }
    .actions button {
      flex: 1;
      padding: 12px;
      font: inherit;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .actions button:active { opacity: 0.7; }

    #mic {
      align-self: center;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 0;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    #mic:active { transform: scale(0.95); }
    #mic svg { width: 44px; height: 44px; fill: currentColor; }
    #mic.listening {
      background: var(--rec);
      animation: pulse 1.4s ease-in-out infinite;
    }
    #mic:disabled { opacity: 0.4; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217,48,37,0.5); }
      50% { box-shadow: 0 0 0 18px rgba(217,48,37,0); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Dictée</h1>
    <span id="status">Appuyez sur le micro</span>
  </header>

  <div class="zone">
    <textarea id="text" placeholder="Le texte dicté apparaîtra ici…"></textarea>
    <div id="interim" aria-live="polite"></div>
  </div>

  <div class="actions">
    <button id="copy" type="button">Copier</button>
    <button id="clear" type="button">Effacer</button>
  </div>

  <button id="mic" type="button" aria-label="Démarrer la dictée">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>

  <script>
    const textEl = document.getElementById('text');
    const interimEl = document.getElementById('interim');
    const statusEl = document.getElementById('status');
    const micBtn = document.getElementById('mic');
    const STORAGE_KEY = 'dictee-texte';

    // Restaure le texte de la dernière session
    try { textEl.value = localStorage.getItem(STORAGE_KEY) || ''; } catch (e) {}
    function save() {
      try { localStorage.setItem(STORAGE_KEY, textEl.value); } catch (e) {}
    }
    textEl.addEventListener('input', save);

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      micBtn.disabled = true;
      statusEl.textContent = 'Reconnaissance vocale non disponible (utilisez Chrome)';
    }

    let recognition = null;
    let listening = false;

    // Commandes vocales : "à la ligne", "retour à la ligne", "nouvelle ligne",
    // "nouveau paragraphe" (ligne vide).
    function applyCommands(phrase) {
      return phrase
        .replace(/(^|\s)nouveau paragraphe[.,!?]?(?=\s|$)/gi, '\n\n')
        .replace(/(^|\s)(?:retour )?[àa] la ligne[.,!?]?(?=\s|$)/gi, '\n')
        .replace(/(^|\s)nouvelle ligne[.,!?]?(?=\s|$)/gi, '\n')
        .replace(/[ \t]*\n[ \t]*/g, '\n')
        .replace(/\n(\S)/g, (m, c) => '\n' + c.toUpperCase());
    }

    function appendText(phrase) {
      phrase = applyCommands(phrase.trim());
      if (!phrase) return;
      phrase = phrase.charAt(0).toUpperCase() + phrase.slice(1);
      const current = textEl.value;
      const sep = current && !/\s$/.test(current) && phrase[0] !== '\n' ? ' ' : '';
      textEl.value = current + sep + phrase;
      textEl.scrollTop = textEl.scrollHeight;
      save();
    }

    function startSession() {
      // Sur Android, le mode "continuous" duplique les résultats :
      // on enchaîne plutôt des sessions courtes tant que l'écoute est active.
      recognition = new SR();
      recognition.lang = 'fr-FR';
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const res = event.results[i];
          if (res.isFinal) appendText(res[0].transcript);
          else interim += res[0].transcript;
        }
        interimEl.textContent = interim;
      };

      recognition.onerror = (event) => {
        if (event.error === 'no-speech' || event.error === 'aborted') return;
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          statusEl.textContent = 'Accès au micro refusé';
        } else if (event.error === 'network') {
          statusEl.textContent = 'Pas de connexion internet';
        } else {
          statusEl.textContent = 'Erreur : ' + event.error;
        }
        stop(false);
      };

      recognition.onend = () => {
        interimEl.textContent = '';
        if (listening) {
          try { startSession(); } catch (e) { stop(); }
        }
      };

      recognition.start();
    }

    function start() {
      listening = true;
      micBtn.classList.add('listening');
      micBtn.setAttribute('aria-label', 'Arrêter la dictée');
      statusEl.textContent = 'J’écoute…';
      try { startSession(); } catch (e) { stop(); }
    }

    function stop(resetStatus = true) {
      listening = false;
      micBtn.classList.remove('listening');
      micBtn.setAttribute('aria-label', 'Démarrer la dictée');
      if (resetStatus) statusEl.textContent = 'Appuyez sur le micro';
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
    }

    micBtn.addEventListener('click', () => (listening ? stop() : start()));

    document.getElementById('clear').addEventListener('click', () => {
      if (!textEl.value || confirm('Effacer tout le texte ?')) {
        textEl.value = '';
        save();
      }
    });

    document.getElementById('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(textEl.value);
        statusEl.textContent = 'Texte copié';
      } catch (e) {
        textEl.select();
        document.execCommand('copy');
        statusEl.textContent = 'Texte copié';
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
